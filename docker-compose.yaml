services:
  postgres:
    image: postgres:13.3
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER_FILE: /run/secrets/nosql1_postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/nosql1_postgres_password
    secrets:
      - nosql1_postgres_user
      - nosql1_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: init-sql
        target: /docker-entrypoint-initdb.d/init.sql
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db -U $$(cat /run/secrets/nosql1_postgres_user)"]
      timeout: 1s
      interval: 1s
      retries: 5
      start_period: 2s
    networks:
      - postgres_net
  
  backend:
    image: nosql-lab1-backend:latest
    depends_on:
      - postgres
      - etcd1
      - etcd2
      - etcd3
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_URL: postgresql://postgres:5432/db
      POSTGRES_USER_FILE: /run/secrets/nosql1_postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/nosql1_postgres_password
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      FIRESTORE_PROJECT_ID: nosql-lab2-33ab6
      FIRESTORE_SECRET_PATH: /app/config/firestore.json
      FIRESTORE_SCOPES: https://www.googleapis.com/auth/datastore
    configs:
      - source: firestore-config
        target: /app/config/firestore.json
        mode: 0444
    networks:
      - postgres_net
      - etcd_net
      - web_server_net
    secrets:
      - nosql1_postgres_user
      - nosql1_postgres_password
    ports:
      - "8080:8080"

  # На заметку: https://etcd.io/docs/v2.3/docker_guide/
  etcd1:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd1_data:/etcd-data
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    networks:
      - etcd_net

  etcd2:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd2_data:/etcd-data
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    networks:
      - etcd_net

  etcd3:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd3_data:/etcd-data
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    networks:
      - etcd_net

  nginx:
    image: nosql-lab1-frontend:latest
    restart: on-failure
    ports:
      - "5450:5450"
    networks:
      - web_server_net

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  postgres_data:

secrets:
  nosql1_postgres_user:
    external: true
  nosql1_postgres_password:
    external: true

networks:
  postgres_net:
  etcd_net:
  web_server_net:

configs:
  init-sql:
    file: ./postgres/init.sql
  firestore-config:
    file: ./.dev/firestore.json