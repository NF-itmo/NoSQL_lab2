server.port=8080
logging.level.root=INFO

# Auth Service
auth-service.invite-code=AAAA

# Orders Service
orders-service.order-ttl-seconds=300

# Settings Service
settings-service.cache-ttl-seconds=600

# Books Service
books-service.search-cache-ttl-seconds=60

# PostgreSQL
spring.datasource.url=jdbc:${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Etcd
etcd.endpoints=${ETCD_ENDPOINTS}

# Firestore
spring.cloud.gcp.project-id=${FIRESTORE_PROJECT_ID}
spring.cloud.gcp.credentials.location=file:${FIRESTORE_SECRET_PATH}
spring.cloud.gcp.credentials.scopes=${FIRESTORE_SCOPES}

# JWT Configuration
jwt.secret=${JWT_SECRET:secret-key}
jwt.expiration=${JWT_TTL:3600000}